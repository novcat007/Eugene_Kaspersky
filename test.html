<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <table class="my-table">
        <caption>Чек</caption>
        <thead>
            <tr>
                <th>Наименование</th>
                <th>Цена</th>
                <th>Кол-во</th>
                <th>Стоимость</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ручка</td>
                <td>50</td>
                <td>5</td>
                <td>250</td>
            </tr>
            <tr>
                <td>Ластик</td>
                <td>20</td>
                <td>3</td>
                <td>60</td>
            </tr>
            <tr>
                <td>Тетрадь</td>
                <td>52</td>
                <td>4</td>
                <td>208</td>
            </tr>
            </tr>
            <tr>
                <td colspan="3">Итого:</td>
                <td>518</td>
            </tr>
        </tbody>
    </table>
    <form id="reg" action="">
        <label for="">Введите логин</label><br>
        <input type="text" name="login" id="login" placeholder="Логин" required><br>
        <label for="">Введите пароль</label><br>
        <input type="password" name="pass" id="pass" placeholder="Пароль" required><br>
         <label for="mail">электронная почта </label><br>
        <input type="email" name="name" id="name" placeholder="электронная почта" required><br>
        <label for="agreement">Согласие на обработку персональных данных</label><br>
        <input type="checkbox" name="agreement" id="agreement" required checked><br>
        <input type="submit" value="Зарегестрироваться"><br>
        <p>Выберите пол</p>
        <input type="radio" name="gender" id="male" value="male" checked>
        <label for="male">м</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">ж</label><br>
        <label for="city">Выберите город</label><br>
        <select name="city" id="city" > 
        <option selected disabled>Выберите город</option>
        <option value="chel">Челябинск</option>
        <option value="msc">Москва</option>
        <option value="novosib">Новгород</option>
        </select> <br>
        <label for="info">Доп информация</label> <br>
        <textarea rows="4" cols="50" name="info" id="info" placeholder="Введите текст"></textarea><br>
    </form>
</body>

</html>
